baseURL = 'https://cfb.phares.io/'
languageCode = 'en-us'
title = 'Remaining CFB Ranked Matchups'
theme = 'cfb'
disableKinds = ['taxonomy', 'term']

[params]
  apiBaseUrl = 'https://api.collegefootballdata.com'

# resources.GetRemote uses the getresource cache (getjson is only for data.GetJSON).
[caches]
  [caches.getresource]
    maxAge = "14h"
